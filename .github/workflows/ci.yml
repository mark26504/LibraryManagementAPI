name: .NET CI

on:
  push:
    branches:
      - master
      - feature/ci-cd

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LibraryManagement.slnx

      - name: Build solution
        run: dotnet build LibraryManagement.slnx --configuration Release --no-restore